name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the app does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Remember that the scope is single videos only.
  - type: checkboxes
    id: scope
    attributes:
      label: Checks
      options:
        - label: I have read the design invariants in CONTRIBUTING.md
          required: true
