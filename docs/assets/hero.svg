<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">video-downloader</title>
  <desc id="d">Paste a video link, a Cloudflare container downloads it with yt-dlp and you get an H.264 MP4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#1b1640"/>
    </linearGradient>
    <linearGradient id="cf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbad41"/>
      <stop offset="1" stop-color="#f38020"/>
    </linearGradient>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/>
      <stop offset=".5" stop-color="#d62976"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f38020" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f38020" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#fbad41"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 830px 205px; }
    @keyframes pulse { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>

  <!-- Title -->
  <text x="64" y="128" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">video-downloader</text>
  <text x="66" y="176" font-size="24" fill="#c9d1e4">Paste a link. Get an MP4 that plays everywhere.</text>
  <text x="66" y="210" font-size="18" fill="#8b95b0">Self-hosted on Cloudflare Workers, Containers and R2.</text>
  <text x="66" y="236" font-size="18" fill="#8b95b0">Private by default with Cloudflare Access.</text>

  <!-- Platform chips -->
  <g font-size="16" font-weight="600" fill="#e8ecf6">
    <rect x="64" y="290" width="128" height="40" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="82" y="302" width="22" height="16" rx="5" fill="#ff0033"/><path d="M90 306l7 4-7 4z" fill="#fff"/>
    <text x="114" y="316">YouTube</text>

    <rect x="204" y="290" width="70" height="40" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M222 302 L234 318 M234 302 L222 318" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <text x="244" y="316">X</text>

    <rect x="286" y="290" width="140" height="40" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="303" y="301" width="18" height="18" rx="5" fill="url(#ig)"/><circle cx="312" cy="310" r="4.2" fill="none" stroke="#fff" stroke-width="1.8"/>
    <text x="330" y="316">Instagram</text>

    <rect x="438" y="290" width="138" height="40" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="465" cy="310" r="10" fill="#1877f2"/><text x="461.5" y="316" font-size="15" font-weight="800" fill="#fff">f</text>
    <text x="482" y="316">Facebook</text>
  </g>
  <text x="66" y="370" font-size="15" fill="#6f7a96" class="mono">single videos · up to 1080p · H.264 + AAC · auto-deleted after 24 h</text>

  <!-- Illustration: link -> cloud -> mp4 -->
  <circle cx="830" cy="205" r="150" fill="url(#glow)" class="pulse"/>

  <!-- link card -->
  <g transform="translate(640 120)">
    <rect width="150" height="58" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <circle cx="22" cy="29" r="9" fill="none" stroke="#9fb0d6" stroke-width="2"/>
    <path d="M17 29h10M22 20c4 5 4 13 0 18M22 20c-4 5-4 13 0 18" stroke="#9fb0d6" stroke-width="1.5" fill="none"/>
    <text x="40" y="34" font-size="14" fill="#dfe6f5" class="mono">youtu.be/…</text>
  </g>
  <path d="M715 182 C 730 215, 760 230, 778 232" fill="none" stroke="#fbad41" stroke-width="3" class="flow" marker-end="url(#arrow)"/>

  <!-- cloud with container -->
  <g transform="translate(780 175)">
    <path d="M30 95 h120 a40 40 0 0 0 4 -80 a55 55 0 0 0 -104 -6 a45 45 0 0 0 -20 86z" fill="url(#cf)"/>
    <g transform="translate(62 40)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round">
      <path d="M28 2 L52 14 L52 40 L28 52 L4 40 L4 14 Z"/>
      <path d="M4 14 L28 26 L52 14 M28 26 V52"/>
    </g>
    <text x="90" y="125" font-size="13" text-anchor="middle" fill="#fbd4a8" class="mono">yt-dlp + ffmpeg</text>
  </g>

  <path d="M942 230 C 975 228, 1000 214, 1020 196" fill="none" stroke="#fbad41" stroke-width="3" class="flow" marker-end="url(#arrow)"/>

  <!-- mp4 file -->
  <g transform="translate(1030 92)">
    <path d="M0 14 a14 14 0 0 1 14 -14 h104 l38 38 v154 a14 14 0 0 1 -14 14 h-128 a14 14 0 0 1 -14 -14z" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".25"/>
    <path d="M118 0 v24 a14 14 0 0 0 14 14 h24" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
    <circle cx="78" cy="100" r="34" fill="#22c55e"/>
    <path d="M68 82 L96 100 L68 118 Z" fill="#ffffff"/>
    <text x="78" y="168" font-size="22" font-weight="800" text-anchor="middle" fill="#ffffff">MP4</text>
    <text x="78" y="190" font-size="13" text-anchor="middle" fill="#9fb0d6" class="mono">H.264 · 1080p</text>
  </g>
</svg>
