<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="t d">
  <title id="t">video-downloader architecture</title>
  <desc id="d">The browser reaches the Worker through Cloudflare Access. The Worker validates the link and creates a job in a Durable Object. The Durable Object alarm starts a container that runs yt-dlp and ffmpeg against the video platform, streams the MP4 back, and the Durable Object stores it in R2 with a one-day lifecycle. The browser downloads the file through the Worker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#161a36"/>
    </linearGradient>
    <linearGradient id="cf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbad41"/>
      <stop offset="1" stop-color="#f38020"/>
    </linearGradient>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#feda75"/>
      <stop offset=".5" stop-color="#d62976"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#fbad41"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4ade80"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8ecf6; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; fill: #9aa6c4; }
    .lbl { font-size: 12px; fill: #fbd4a8; }
    .lblg { font-size: 12px; fill: #bbf7d0; }
    .box { fill: #ffffff; fill-opacity: .06; stroke: #ffffff; stroke-opacity: .16; }
    .wire { fill: none; stroke: #fbad41; stroke-width: 2.4; }
    .back { fill: none; stroke: #4ade80; stroke-width: 2.4; }
    .flow { stroke-dasharray: 6 7; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    .num { fill: #f38020; }
    .numt { font-size: 13px; font-weight: 800; fill: #ffffff; }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <rect width="1280" height="760" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="760" rx="24" fill="url(#grid)"/>

  <text x="40" y="52" font-size="24" font-weight="800">How a download flows</text>
  <text x="40" y="78" class="s">Everything inside the dashed area runs in your own Cloudflare account.</text>

  <!-- Cloudflare account boundary -->
  <rect x="250" y="104" width="760" height="560" rx="20" fill="#f38020" fill-opacity=".035" stroke="#f38020" stroke-opacity=".6" stroke-dasharray="8 6"/>
  <g transform="translate(272 122)">
    <path d="M6 20 h30 a10 10 0 0 0 1 -20 a14 14 0 0 0 -26 -1.5 a11 11 0 0 0 -5 21.5z" fill="url(#cf)"/>
    <text x="54" y="16" font-size="14" font-weight="700" fill="#fbad41">Your Cloudflare account</text>
  </g>

  <!-- Browser -->
  <g transform="translate(40 300)">
    <rect width="170" height="150" rx="14" class="box"/>
    <rect x="16" y="18" width="138" height="78" rx="8" fill="#0b1022" stroke="#ffffff" stroke-opacity=".15"/>
    <circle cx="28" cy="29" r="3" fill="#ff5f57"/><circle cx="38" cy="29" r="3" fill="#febc2e"/><circle cx="48" cy="29" r="3" fill="#28c840"/>
    <rect x="26" y="44" width="118" height="16" rx="8" fill="#ffffff" fill-opacity=".08"/>
    <text x="34" y="56" font-size="10" class="mono" fill="#9aa6c4">paste a link…</text>
    <rect x="26" y="68" width="56" height="16" rx="8" fill="#f38020"/>
    <text x="35" y="80" font-size="10" font-weight="700">Download</text>
    <text x="16" y="122" class="h">You</text>
    <text x="16" y="140" class="s">browser, any device</text>
  </g>

  <!-- Access -->
  <g transform="translate(276 300)">
    <rect width="140" height="150" rx="14" class="box"/>
    <path d="M70 22 l30 11 v20 c0 20 -13 34 -30 40 c-17 -6 -30 -20 -30 -40 v-20z" fill="#f38020" fill-opacity=".18" stroke="#fbad41" stroke-width="2"/>
    <path d="M58 56 l9 9 l16 -18" fill="none" stroke="#fbad41" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="120" class="h" text-anchor="middle">Access</text>
    <text x="70" y="138" class="s" text-anchor="middle">only your email</text>
  </g>

  <!-- Worker -->
  <g transform="translate(452 260)">
    <rect width="230" height="230" rx="14" class="box"/>
    <rect width="230" height="44" rx="14" fill="#f38020" fill-opacity=".16"/>
    <path d="M22 12 l10 10 l-10 10 M38 32 h12" fill="none" stroke="#fbad41" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="28" class="h">Worker</text>
    <text x="16" y="72" font-size="13">API + static UI</text>
    <g class="s">
      <text x="16" y="100">✓ verifies the Access JWT</text>
      <text x="16" y="124">✓ allow-lists single-video</text>
      <text x="30" y="142">URLs per platform</text>
      <text x="16" y="166">✓ resolves facebook.com/</text>
      <text x="30" y="184">share links (anti-SSRF)</text>
      <text x="16" y="208">✓ weekly smoke cron</text>
    </g>
  </g>

  <!-- Job index -->
  <g transform="translate(452 140)">
    <rect width="230" height="76" rx="14" class="box"/>
    <path d="M18 22 h22 M18 34 h22 M18 46 h22 M18 58 h14" stroke="#9aa6c4" stroke-width="2.4" stroke-linecap="round"/>
    <text x="54" y="34" class="h">Job list</text>
    <text x="54" y="54" class="s">Durable Object, 25 h window</text>
  </g>

  <!-- Job Durable Object -->
  <g transform="translate(744 140)">
    <rect width="240" height="150" rx="14" class="box"/>
    <circle cx="34" cy="38" r="15" fill="none" stroke="#a78bfa" stroke-width="2.4"/>
    <path d="M34 29 v10 l7 4" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round"/>
    <text x="60" y="34" class="h">Job</text>
    <text x="60" y="52" class="s">one Durable Object per job</text>
    <g class="s">
      <text x="18" y="82">state + alarm-driven retries</text>
      <text x="18" y="104">3 attempts × 14 min, then fail</text>
      <text x="18" y="126">cleans up after 24 h</text>
    </g>
  </g>

  <!-- Container -->
  <g transform="translate(744 350)">
    <rect width="240" height="160" rx="14" class="box"/>
    <g transform="translate(18 16)" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round">
      <path d="M16 0 L32 8 L32 26 L16 34 L0 26 L0 8 Z"/>
      <path d="M0 8 L16 16 L32 8 M16 16 V34"/>
    </g>
    <text x="62" y="34" class="h">Container</text>
    <text x="62" y="52" class="s mono">standard-4</text>
    <g class="s">
      <text x="18" y="82">yt-dlp · ffmpeg · Deno</text>
      <text x="18" y="104">converts VP9 / AV1 → H.264</text>
      <text x="18" y="126">caps at 1080p (shorter side)</text>
      <text x="18" y="148">egress to public IPs only</text>
    </g>
  </g>

  <!-- R2 -->
  <g transform="translate(452 560)">
    <rect width="230" height="84" rx="14" class="box"/>
    <g transform="translate(18 18)" fill="none" stroke="#4ade80" stroke-width="2.2">
      <ellipse cx="18" cy="7" rx="18" ry="7"/>
      <path d="M0 7 v34 c0 4 8 7 18 7 s18 -3 18 -7 v-34"/>
      <path d="M0 24 c0 4 8 7 18 7 s18 -3 18 -7"/>
    </g>
    <text x="70" y="40" class="h">R2 bucket</text>
    <text x="70" y="60" class="s">complete files, 1-day TTL</text>
  </g>

  <!-- Platforms -->
  <g transform="translate(1060 230)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#9aa6c4">THE INTERNET</text>
    <g transform="translate(0 20)">
      <rect width="180" height="48" rx="12" class="box"/>
      <rect x="16" y="15" width="26" height="18" rx="5" fill="#ff0033"/><path d="M25 19 l8 5 l-8 5z" fill="#fff"/>
      <text x="54" y="30" font-size="15" font-weight="600">YouTube</text>
    </g>
    <g transform="translate(0 80)">
      <rect width="180" height="48" rx="12" class="box"/>
      <path d="M21 16 L37 32 M37 16 L21 32" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="54" y="30" font-size="15" font-weight="600">X</text>
    </g>
    <g transform="translate(0 140)">
      <rect width="180" height="48" rx="12" class="box"/>
      <rect x="18" y="13" width="22" height="22" rx="6" fill="url(#ig)"/><circle cx="29" cy="24" r="5" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="54" y="30" font-size="15" font-weight="600">Instagram</text>
    </g>
    <g transform="translate(0 200)">
      <rect width="180" height="48" rx="12" class="box"/>
      <circle cx="29" cy="24" r="12" fill="#1877f2"/><text x="25" y="31" font-size="17" font-weight="800">f</text>
      <text x="54" y="30" font-size="15" font-weight="600">Facebook</text>
    </g>
  </g>

  <!-- Wires: request path (orange) -->
  <path d="M210 360 H272" class="wire flow" marker-end="url(#a)"/>
  <path d="M416 360 H448" class="wire flow" marker-end="url(#a)"/>
  <path d="M682 300 C 712 300, 712 230, 740 230" class="wire flow" marker-end="url(#a)"/>
  <path d="M567 260 V220" class="wire flow" marker-end="url(#a)"/>
  <path d="M864 290 V346" class="wire flow" marker-end="url(#a)"/>
  <path d="M984 420 H1056" class="wire flow" marker-end="url(#a)"/>
  <!-- Wires: file path (green) -->
  <path d="M984 470 C 1010 470, 1010 600, 860 600 H686" class="back flow" marker-end="url(#g)"/>
  <path d="M500 560 V496" class="back flow" marker-end="url(#g)"/>
  <path d="M452 476 H125 V456" class="back flow" marker-end="url(#g)"/>

  <!-- Step numbers -->
  <g>
    <circle cx="241" cy="342" r="11" class="num"/><text x="241" y="347" class="numt" text-anchor="middle">1</text>
    <circle cx="712" cy="250" r="11" class="num"/><text x="712" y="255" class="numt" text-anchor="middle">2</text>
    <circle cx="884" cy="318" r="11" class="num"/><text x="884" y="323" class="numt" text-anchor="middle">3</text>
    <circle cx="1020" cy="402" r="11" class="num"/><text x="1020" y="407" class="numt" text-anchor="middle">4</text>
    <circle cx="1008" cy="560" r="11" fill="#22c55e"/><text x="1008" y="565" class="numt" text-anchor="middle">5</text>
    <circle cx="346" cy="476" r="11" fill="#22c55e"/><text x="346" y="481" class="numt" text-anchor="middle">6</text>
  </g>
  <text x="590" y="244" class="lbl">list</text>

  <!-- Legend -->
  <circle cx="49" cy="690" r="9" fill="#fbad41"/><text x="49" y="694.5" font-size="11" font-weight="800" text-anchor="middle" fill="#0b1022">1</text><text x="66" y="694" class="s">POST /api/jobs</text>
  <circle cx="229" cy="690" r="9" fill="#fbad41"/><text x="229" y="694.5" font-size="11" font-weight="800" text-anchor="middle" fill="#0b1022">2</text><text x="246" y="694" class="s">job created</text>
  <circle cx="389" cy="690" r="9" fill="#fbad41"/><text x="389" y="694.5" font-size="11" font-weight="800" text-anchor="middle" fill="#0b1022">3</text><text x="406" y="694" class="s">alarm starts the container</text>
  <circle cx="649" cy="690" r="9" fill="#fbad41"/><text x="649" y="694.5" font-size="11" font-weight="800" text-anchor="middle" fill="#0b1022">4</text><text x="666" y="694" class="s">yt-dlp downloads the video</text>
  <circle cx="49" cy="720" r="9" fill="#4ade80"/><text x="49" y="724.5" font-size="11" font-weight="800" text-anchor="middle" fill="#0b1022">5</text><text x="66" y="724" class="s">MP4 streamed back, stored with a fixed length</text>
  <circle cx="429" cy="720" r="9" fill="#4ade80"/><text x="429" y="724.5" font-size="11" font-weight="800" text-anchor="middle" fill="#0b1022">6</text><text x="446" y="724" class="s">UI polls the job, then GET /api/files/:id</text>
</svg>
